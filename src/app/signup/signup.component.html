<div class="min-h-screen bg-gray-900 flex flex-col md:flex-row items-center">
  
  <!-- LEFT SIDE: Branding -->
  <div class="w-full md:w-1/2 flex flex-col items-center justify-center p-8 text-center">
    <div class="relative inline-block">
      <h1 class="text-6xl md:text-5xl font-black tracking-tighter text-white uppercase italic">
        ENERGY<span class="text-indigo-500">HUB</span>
      </h1>
      <!-- Animated Underline -->
      <div class="h-2 w-full bg-gradient-to-r from-indigo-500 to-purple-600 mt-2 rounded-full shadow-[0_0_15px_rgba(99,102,241,0.6)]"></div>
    </div>
    <p class="text-gray-500 text-sm mt-6 font-bold uppercase tracking-[0.4em] opacity-50">
      Industrial IoT Portal
    </p>
  </div>

  <div class="w-full md:w-1/2 flex items-center justify-center p-4 md:p-12">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-700/50 backdrop-blur-md">
      <div class="mb-3">
        <h2 class="text-3xl font-bold text-white">Register User</h2>
      </div>

      <form #signupForm="ngForm" (ngSubmit)="handleSignup(signupForm)" class="space-y-4">
        
        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Full Name</label>
          <input name="fullName" ngModel required #fn="ngModel" type="text" placeholder="John Doe"
                 class="w-full p-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Username</label>
            <input name="username" ngModel required #u="ngModel" type="text" placeholder="jdoe24"
                   class="w-full p-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
          </div>
          <div>
            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Emp ID</label>
            <input name="employeeId" ngModel required #emp="ngModel" type="text" placeholder="1002"
                   class="w-full p-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
          </div>
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Official Email</label>
          <input name="email" ngModel required email #e="ngModel" type="email" placeholder="name@company.com"
                 class="w-full p-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"
                 [class.border-red-500]="e.invalid && e.touched">
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Phone</label>
          <input name="phoneNumber" ngModel required #ph="ngModel" type="tel" placeholder="+91 XXXXX XXXXX"
                 class="w-full p-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Password</label>
          <input name="password" ngModel required minlength="8" #p="ngModel" type="password" placeholder="••••••••"
                 class="w-full p-3 bg-gray-700 border border-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
          
          <div *ngIf="passwordError || (p.invalid && p.touched)" class="mt-2">
            <p class="text-red-400 text-[10px]">● {{ passwordError || 'Minimum 8 characters.' }}</p>
          </div>
        </div>
        
        <button type="submit" [disabled]="signupForm.invalid"
          class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98]">
          Submit Registration
        </button>

        <p class="text-center text-gray-500 text-xs pt-4">
          Already a member? <a routerLink="/login" class="text-indigo-400 font-bold hover:underline">Sign In</a>
        </p>
      </form>
    </div>
  </div>

</div>
